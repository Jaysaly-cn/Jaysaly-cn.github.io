<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">植保智能体可视化</title>
  <desc id="desc">展示田间问题输入、智能体执行链和带证据诊断卡片的界面。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eef7e8"/>
      <stop offset="1" stop-color="#f7faf4"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
  <rect x="36" y="36" width="888" height="468" rx="24" fill="#fff" stroke="#d6e5d9"/>
  <text x="72" y="91" fill="#173c28" font-family="Arial, sans-serif" font-size="24" font-weight="700">PLANT PROTECTION AGENT</text>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700">
    <rect x="72" y="124" width="122" height="48" rx="12" fill="#ecf8f0" stroke="#93c8a8"/><text x="133" y="153" text-anchor="middle" fill="#226943">SLOT EXTRACT</text>
    <text x="205" y="153" fill="#9aa79e">→</text>
    <rect x="224" y="124" width="122" height="48" rx="12" fill="#ecf8f0" stroke="#93c8a8"/><text x="285" y="153" text-anchor="middle" fill="#226943">INTENT ROUTER</text>
    <text x="357" y="153" fill="#9aa79e">→</text>
    <rect x="376" y="124" width="122" height="48" rx="12" fill="#ecf8f0" stroke="#93c8a8"/><text x="437" y="153" text-anchor="middle" fill="#226943">RAG EVIDENCE</text>
    <text x="509" y="153" fill="#9aa79e">→</text>
    <rect x="528" y="124" width="122" height="48" rx="12" fill="#ecf8f0" stroke="#93c8a8"/><text x="589" y="153" text-anchor="middle" fill="#226943">ARBITRATION</text>
    <text x="661" y="153" fill="#9aa79e">→</text>
    <rect x="680" y="124" width="198" height="48" rx="12" fill="#155b39"/><text x="779" y="153" text-anchor="middle" fill="#fff">SAFETY + ANSWER</text>
  </g>
  <rect x="72" y="208" width="310" height="246" rx="18" fill="#f6faf6" stroke="#dce8de"/>
  <text x="98" y="246" fill="#64766a" font-family="Arial, sans-serif" font-size="13" font-weight="700">FIELD OBSERVATION</text>
  <text x="98" y="282" fill="#263b2e" font-family="Arial, sans-serif" font-size="17">水稻分蘖期出现枯鞘和枯心苗，</text>
  <text x="98" y="312" fill="#263b2e" font-family="Arial, sans-serif" font-size="17">剥开稻茎可见蛀道和虫粪。</text>
  <rect x="98" y="350" width="130" height="34" rx="17" fill="#def3e5"/>
  <text x="163" y="372" text-anchor="middle" fill="#226943" font-family="Arial, sans-serif" font-size="12" font-weight="700">虫害 · 水稻</text>
  <rect x="98" y="402" width="248" height="34" rx="10" fill="#155b39"/>
  <text x="222" y="424" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="700">START AGENT</text>
  <rect x="414" y="208" width="464" height="246" rx="18" fill="#fff" stroke="#dce8de"/>
  <rect x="442" y="236" width="176" height="30" rx="15" fill="#dcfce7"/>
  <text x="530" y="256" text-anchor="middle" fill="#155b39" font-family="Arial, sans-serif" font-size="12" font-weight="700">MEDIUM CONFIDENCE</text>
  <text x="442" y="310" fill="#173c28" font-family="Arial, sans-serif" font-size="30" font-weight="700">疑似二化螟为害</text>
  <text x="442" y="338" fill="#758279" font-family="Arial, sans-serif" font-size="15" font-style="italic">Chilo suppressalis (Walker)</text>
  <circle cx="451" cy="377" r="5" fill="#57ad78"/><text x="468" y="382" fill="#435248" font-family="Arial, sans-serif" font-size="14">枯心苗与蛀茎症状相符</text>
  <circle cx="451" cy="408" r="5" fill="#57ad78"/><text x="468" y="413" fill="#435248" font-family="Arial, sans-serif" font-size="14">知识卡证据 + 相似害虫鉴别</text>
  <rect x="714" y="346" width="132" height="72" rx="14" fill="#fffae8" stroke="#f2d699"/>
  <text x="780" y="375" text-anchor="middle" fill="#8b590b" font-family="Arial, sans-serif" font-size="12" font-weight="700">SAFETY GUARD</text>
  <text x="780" y="397" text-anchor="middle" fill="#8b590b" font-family="Arial, sans-serif" font-size="11">IPM FIRST</text>
