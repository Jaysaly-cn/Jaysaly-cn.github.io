<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">AgriWorld 农业世界模型可视化</title>
  <desc id="desc">包含环境参数、作物生长曲线和模型处理节点的绿色仪表板。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e9f8ec"/>
      <stop offset="1" stop-color="#f7faf4"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#57ad78" stop-opacity=".36"/>
      <stop offset="1" stop-color="#57ad78" stop-opacity=".03"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
  <rect x="36" y="36" width="888" height="468" rx="24" fill="#fff" stroke="#d6e5d9"/>
  <rect x="68" y="74" width="250" height="392" rx="18" fill="#f5faf5" stroke="#dce8de"/>
  <text x="94" y="118" fill="#173c28" font-family="Arial, sans-serif" font-size="24" font-weight="700">ENVIRONMENT</text>
  <g font-family="Arial, sans-serif" font-size="16" fill="#64766a">
    <text x="94" y="164">SOIL WATER</text><text x="270" y="164" text-anchor="end" fill="#247a4d" font-weight="700">72%</text>
    <rect x="94" y="178" width="176" height="8" rx="4" fill="#dbe8de"/><rect x="94" y="178" width="127" height="8" rx="4" fill="#57ad78"/>
    <text x="94" y="226">NITROGEN</text><text x="270" y="226" text-anchor="end" fill="#247a4d" font-weight="700">68%</text>
    <rect x="94" y="240" width="176" height="8" rx="4" fill="#dbe8de"/><rect x="94" y="240" width="120" height="8" rx="4" fill="#57ad78"/>
    <text x="94" y="288">HEAT STRESS</text><text x="270" y="288" text-anchor="end" fill="#d97706" font-weight="700">24%</text>
    <rect x="94" y="302" width="176" height="8" rx="4" fill="#f2e5cf"/><rect x="94" y="302" width="42" height="8" rx="4" fill="#e6a13e"/>
    <text x="94" y="350">VPD STRESS</text><text x="270" y="350" text-anchor="end" fill="#d97706" font-weight="700">32%</text>
    <rect x="94" y="364" width="176" height="8" rx="4" fill="#f2e5cf"/><rect x="94" y="364" width="56" height="8" rx="4" fill="#e6a13e"/>
  </g>
  <rect x="94" y="408" width="176" height="38" rx="10" fill="#155b39"/>
  <text x="182" y="433" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700">RUN COUNTERFACTUAL</text>
  <text x="354" y="96" fill="#173c28" font-family="Arial, sans-serif" font-size="22" font-weight="700">BIOMASS TRAJECTORY</text>
  <text x="879" y="98" text-anchor="end" fill="#247a4d" font-family="Arial, sans-serif" font-size="36" font-weight="700">78</text>
  <text x="879" y="118" text-anchor="end" fill="#77867c" font-family="Arial, sans-serif" font-size="12">RELATIVE YIELD</text>
  <g stroke="#e6ede7" stroke-width="1">
    <path d="M354 160H882M354 224H882M354 288H882M354 352H882"/>
  </g>
  <path d="M354 352 C420 350 446 332 486 310 S552 250 600 213 S668 170 724 154 S816 134 882 126 L882 352H354Z" fill="url(#area)"/>
  <path d="M354 352 C420 350 446 332 486 310 S552 250 600 213 S668 170 724 154 S816 134 882 126" fill="none" stroke="#57ad78" stroke-width="7" stroke-linecap="round"/>
  <path d="M354 352 C420 348 452 320 494 288 S564 214 616 170 S718 112 782 92 S844 74 882 68" fill="none" stroke="#aab7ae" stroke-width="3" stroke-dasharray="9 9" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700">
    <rect x="354" y="398" width="92" height="46" rx="11" fill="#ecf8f0" stroke="#93c8a8"/><text x="400" y="425" text-anchor="middle" fill="#226943">INPUT</text>
    <text x="464" y="426" fill="#9aa79e">→</text>
    <rect x="486" y="398" width="112" height="46" rx="11" fill="#ecf8f0" stroke="#93c8a8"/><text x="542" y="425" text-anchor="middle" fill="#226943">EXPERTS</text>
    <text x="616" y="426" fill="#9aa79e">→</text>
    <rect x="638" y="398" width="92" height="46" rx="11" fill="#ecf8f0" stroke="#93c8a8"/><text x="684" y="425" text-anchor="middle" fill="#226943">ODE</text>
    <text x="748" y="426" fill="#9aa79e">→</text>
    <rect x="770" y="398" width="112" height="46" rx="11" fill="#ecf8f0" stroke="#93c8a8"/><text x="826" y="425" text-anchor="middle" fill="#226943">YIELD</text>
  </g>
</svg>
