<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyDeck · 有出处的记忆</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script>
<header><span>STUDYDECK / 学习实验室</span><p>有出处的记忆。</p><small>从资料到卡片，再到下一次复习。每一步都有记录。</small></header>
<main><div id="notice" role="status">正在连接工作台…</div><nav><button data-tab="make">01 制作卡片</button><button data-tab="review">02 到期复习</button><button data-tab="library">03 卡片库</button><button id="export">导出学习记录</button></nav>
<section id="make"><div class="columns"><article><h1>放入一份学习资料</h1><form id="material"><label>资料名称<input name="title" required maxlength="200"></label><label>原文<textarea name="body" required minlength="10" maxlength="12000" rows="9"></textarea></label><button>保存资料</button></form><h2>资料架</h2><div id="sources"></div></article>
<article><h2 id="selected">选择一份资料</h2><pre id="body"></pre><button id="generate" disabled>AI 提议卡片</button><p class="muted">本地免费模型只产生草稿。引用一致不代表答案正确，请逐张核对。</p><form id="manual"><label>问题<input name="question" required minlength="2" maxlength="500"></label><label>答案<textarea name="answer" required minlength="2" maxlength="2000"></textarea></label><label>原文引用<textarea name="quote" required minlength="2" maxlength="2000"></textarea></label><button>保存手工草稿</button></form></article></div><h2>待确认卡片</h2><div id="drafts"></div></section>
<section id="review" hidden><h1>先回忆，再翻面</h1><p class="muted">评分由你判断。FSRS 根据评分安排下一次复习，不代表学习效果保证。</p><div id="queue"></div></section><section id="library" hidden><h1>管理学习卡片</h1><p class="muted">暂停保留原有进度和到期时间；恢复后，已到期的卡片会重新进入复习。拒绝的草稿可恢复。</p><label>查找问题或资料<input id="search" type="search"></label><div id="collection"></div></section></main><footer>本地单人工作台 · FSRS 6.3.2 · 学习记录保存在 SQLite</footer></html>
