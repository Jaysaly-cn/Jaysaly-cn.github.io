<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ApplyTrack · 求职证据工作台</title><link rel="stylesheet" href="/static/style.css"><script defer src="/static/app.js"></script></head>
<body><header><span>APPLYTRACK / 个人求职工作台</span><h1>把岗位要求，连到真实经历。</h1><p>保存岗位原文 · 核对模型候选 · 关联项目证据 · 冻结投递材料</p><label>共享访问令牌（本机可留空）<input id="token" type="password" autocomplete="off"></label><button id="connect">连接工作台</button><p id="status" role="status" aria-live="polite"></p></header>
<main><section><h2>保存岗位</h2><form id="new-job"><label>公司<input name="company" required minlength="2" maxlength="300"></label><label>职位<input name="title" required minlength="2" maxlength="300"></label><label>来源链接（可选）<input name="source_url" type="url"></label><label>完整岗位描述<textarea name="jd" required minlength="10" maxlength="80000" rows="6"></textarea></label><button>保存不可变原文</button></form></section>
<section><h2>我的岗位</h2><p>阶段仅记录个人进度，不会向雇主发送申请或消息。</p><div id="jobs"></div></section>
<section><h2>项目证据库</h2><p>填写可核验的经历，不把演示数据写成真实客户成果。证据保存后不可修改；修订请新增。</p><form id="new-evidence"><label>证据标题<input name="title" required minlength="2" maxlength="300"></label><label>出处链接（可选）<input name="source_url" type="url"></label><label>证据正文<textarea name="body" required minlength="10" maxlength="20000" rows="4"></textarea></label><button>保存证据</button></form><div id="evidence"></div></section>
<section id="workspace"><h2>选择一个岗位开始</h2></section></main><footer>个人本地工作台 · 模型只处理前 4000 字符 · 引用正确不等于能力匹配 · 需人工核对</footer></body></html>
