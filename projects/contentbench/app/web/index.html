<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ContentBench · 内容工作台</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head>
<body><header><div><span class="logo">CB</span><strong>ContentBench</strong><small>从品牌事实到可审核稿件</small></div><button id="auth" class="secondary">访问令牌</button></header>
<div id="message" role="status" aria-live="polite"></div><div class="layout"><aside><p class="eyebrow">CONTENT OPERATIONS</p><h1>让每份稿件<br>都有事实依据。</h1><p id="model-status" class="muted">正在检查模型…</p><button id="new">＋ 新建内容活动</button><nav id="campaigns" aria-label="内容活动"></nav><p class="muted foot">本工作台只保存、审核和导出稿件，不会向社交媒体发送内容。</p></aside>
<main><section id="welcome" class="panel"><p class="eyebrow">开始创作</p><h2>先固定事实，再讨论表达</h2><p>添加产品事实与出处，选择渠道，用免费模型起草或录入已有稿件。每次改稿保留历史，人工审核通过后才能导出。</p><button id="sample" class="secondary">填入合成示例</button></section>
<section id="create" class="panel" hidden><h2>新建活动</h2><p class="muted">事实和约束在创建后固定保存。需要变更事实时，请建立新活动。</p><form id="brief-form"><div class="grid"><label>活动名称<input name="name" required maxlength="120"></label><label>目标读者<input name="audience" required maxlength="120"></label><label>内容目标<input name="objective" required maxlength="120"></label><label>表达语气<input name="tone" required maxlength="120"></label></div><label>品牌事实与出处 · 每行：事实内容 | 出处<textarea name="facts" rows="5" required placeholder="支持手动记录每周任务 | 产品功能说明 v1"></textarea></label><div class="grid"><label>禁用词 · 每行一项<textarea name="forbidden" rows="3" placeholder="行业第一"></textarea></label><label>正文必带说明<input name="required_phrase" maxlength="200" placeholder="例如：示例产品，仅供学习"></label></div><button>保存活动</button></form></section>
<div id="workspace" hidden><section class="panel"><div class="section-head"><div><p class="eyebrow">CAMPAIGN BRIEF</p><h2 id="campaign-title"></h2><p id="campaign-meta" class="muted"></p></div><button id="export" class="secondary">冻结已批准稿件</button></div><details><summary>查看品牌事实与约束</summary><div id="facts"></div></details></section>
<section class="panel"><div class="section-head"><h2 id="editor-title">创建稿件</h2><span class="tag">所有新稿均待审核</span></div><form id="copy-form"><div class="grid"><label>投放渠道<select id="channel" name="channel"><option>小红书</option><option>公众号</option><option>短信</option><option>邮件</option></select></label><div class="generate"><button id="generate" type="button" class="secondary">用免费模型起草</button><small id="channel-limit" class="muted"></small></div></div><label>标题<input name="title" required maxlength="120"></label><label>正文<textarea name="body" rows="7" required maxlength="6000"></textarea></label><fieldset><legend>关联事实 · 勾选不等于语义已验证</legend><div id="fact-choices"></div></fieldset><button id="save-copy">保存待审核稿件</button> <button id="cancel-edit" type="button" class="secondary" hidden>取消修订</button></form></section>
<div class="section-head"><h2>稿件与版本</h2><span id="draft-count" class="muted"></span></div><section id="drafts"></section><section class="panel"><h2>导出记录</h2><div id="exports"></div><details><summary>工作流记录</summary><div id="events"></div></details></section></div></main></div></body></html>
