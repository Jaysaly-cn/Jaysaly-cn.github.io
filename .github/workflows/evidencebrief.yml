name: EvidenceBrief verification
on:
  push:
    paths: ['projects/evidencebrief/**', '.github/workflows/evidencebrief.yml']
  pull_request:
    paths: ['projects/evidencebrief/**', '.github/workflows/evidencebrief.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/evidencebrief
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-lock.txt
      - run: python -m pytest -q
      - run: python -m evals.run
      - run: node --check web/app.js
      - run: node --check web/batch-ui.js
