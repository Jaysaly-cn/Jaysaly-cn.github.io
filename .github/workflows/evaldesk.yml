name: EvalDesk verification
on:
  push:
    paths: ['projects/evaldesk/**', '.github/workflows/evaldesk.yml']
  pull_request:
    paths: ['projects/evaldesk/**', '.github/workflows/evaldesk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: projects/evaldesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: node --check web/app.js
      - run: node --check web/suites.js
      - run: node --check web/jobs.js
