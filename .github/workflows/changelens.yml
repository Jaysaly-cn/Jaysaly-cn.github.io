name: ChangeLens verification
on:
  push:
    paths: ['projects/changelens/**', '.github/workflows/changelens.yml']
  pull_request:
    paths: ['projects/changelens/**', '.github/workflows/changelens.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/changelens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check web/app.js
